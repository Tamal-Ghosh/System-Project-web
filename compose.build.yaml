# Publisher machine only. Consumer machines need only compose.yaml + loaded images.
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      additional_contexts:
        model_assets: ${MODEL_ASSETS_DIR:-D:/DermascopeModelAssets/e55}
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
