name: dermascope-e55
services:
  backend:
    image: dermascope-backend:dermfm-cpu-v2
    platform: linux/amd64
    pull_policy: never
    init: true
    environment:
      E55_BUNDLE_PATH: /opt/models/dermfm
      DERMFM_DEVICE: cpu
      DERMFM_TTA: "true"
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8000"
    command: ["python", "-m", "uvicorn", "inference_app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    healthcheck:
      test: ["CMD", "python", "/opt/healthcheck.py"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 8
    stop_grace_period: 60s
  frontend:
    image: dermascope-frontend:dermfm-v2
    platform: linux/amd64
    pull_policy: never
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5181}:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 30s
      start_period: 60s
      retries: 8
